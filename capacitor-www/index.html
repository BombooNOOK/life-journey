<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Local Storage Diagnostics｜Developer</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1917;
        --muted: #78716c;
        --paper: #f4f6f3;
        --card: #ffffff;
        --line: #e7e5e4;
        --danger: #9a3412;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        background: var(--paper);
        color: var(--ink);
        padding: max(1rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
      }
      main { max-width: 36rem; margin: 0 auto; }
      h1 { font-size: 1.1rem; margin: 0 0 0.35rem; font-family: system-ui, sans-serif; }
      .note, .muted, #platform, .meta { color: var(--muted); font-size: 0.82rem; line-height: 1.45; }
      .actions { display: grid; gap: 0.55rem; margin: 1rem 0; }
      button {
        appearance: none; border: 1px solid var(--line); background: var(--card);
        color: var(--ink); border-radius: 0.5rem; padding: 0.75rem 1rem;
        font-size: 0.9rem; font-weight: 600; font-family: system-ui, sans-serif;
      }
      #btn-clear { color: var(--danger); }
      .status {
        margin: 0.75rem 0; padding: 0.75rem 0.9rem; border-radius: 0.5rem;
        background: #fff; border: 1px solid var(--line); font-size: 0.82rem;
        line-height: 1.45; white-space: pre-wrap;
      }
      .status.err { border-color: #fecaca; background: #fff7f5; color: var(--danger); }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 0.5rem;
        padding: 0.85rem 1rem; margin: 0.55rem 0;
      }
      .card h3 { margin: 0 0 0.4rem; font-size: 1rem; font-family: system-ui, sans-serif; }
      .card p { margin: 0.2rem 0; }
      #preview {
        display: block; max-width: 10rem; margin: 0.75rem 0 0;
        border-radius: 0.5rem; border: 1px solid var(--line); background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>開発者用 Local Storage Diagnostics</h1>
      <p class="note">
        Offline list。表示は SQLite＋Filesystem のみ。製品UIではありません。
      </p>
      <p id="platform" class="muted">platform…</p>
      <div class="actions">
        <button type="button" id="btn-load">端末から読む</button>
        <button type="button" id="btn-clear">端末Localをクリア</button>
        <button type="button" id="btn-security">Run Security PoC (dummy)</button>
        <button type="button" id="btn-key-integration">Run Key Integration PoC</button>
        <button type="button" id="btn-storage-location">Run Storage Location PoC</button>
        <button type="button" id="btn-group-a">Run Group A (non-destructive)</button>
        <button type="button" id="btn-key-persist">Keychain persistence check</button>
      </div>
      <p id="status" class="status">起動中…</p>
      <section>
        <h2 style="font-size: 0.95rem; font-family: system-ui, sans-serif">Security report</h2>
        <pre id="security-report" class="status" style="max-height: 18rem; overflow: auto">未実行</pre>
      </section>
      <section>
        <h2 style="font-size: 0.95rem; font-family: system-ui, sans-serif">読込結果</h2>
        <div id="list"></div>
        <img id="preview" alt="" hidden />
      </section>
    </main>
    <script src="./lab.js"></script>
  </body>
</html>
