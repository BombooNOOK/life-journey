<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Local Storage Diagnostics｜Developer</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1917;
        --muted: #78716c;
        --paper: #f4f6f3;
        --card: #ffffff;
        --line: #e7e5e4;
        --danger: #9a3412;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        background: var(--paper);
        color: var(--ink);
        padding: max(1rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
      }
      main { max-width: 36rem; margin: 0 auto; }
      h1 { font-size: 1.1rem; margin: 0 0 0.35rem; font-family: system-ui, sans-serif; }
      .note, .muted, #platform, .meta { color: var(--muted); font-size: 0.82rem; line-height: 1.45; }
      .actions { display: grid; gap: 0.55rem; margin: 1rem 0; }
      button {
        appearance: none; border: 1px solid var(--line); background: var(--card);
        color: var(--ink); border-radius: 0.5rem; padding: 0.75rem 1rem;
        font-size: 0.9rem; font-weight: 600; font-family: system-ui, sans-serif;
      }
      #btn-clear { color: var(--danger); }
      .status {
        margin: 0.75rem 0; padding: 0.75rem 0.9rem; border-radius: 0.5rem;
        background: #fff; border: 1px solid var(--line); font-size: 0.82rem;
        line-height: 1.45; white-space: pre-wrap;
      }
      .status.err { border-color: #fecaca; background: #fff7f5; color: var(--danger); }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 0.5rem;
        padding: 0.85rem 1rem; margin: 0.55rem 0;
      }
      .card h3 { margin: 0 0 0.4rem; font-size: 1rem; font-family: system-ui, sans-serif; }
      .card p { margin: 0.2rem 0; }
      #preview {
        display: block; max-width: 10rem; margin: 0.75rem 0 0;
        border-radius: 0.5rem; border: 1px solid var(--line); background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>開発者用 Local Storage Diagnostics</h1>
      <p class="note">
        Offline list。表示は SQLite＋Filesystem のみ。製品UIではありません。
      </p>
      <p id="platform" class="muted">platform…</p>
      <div class="actions">
        <button type="button" id="btn-load">端末から読む</button>
        <button type="button" id="btn-clear">端末Localをクリア</button>
        <button type="button" id="btn-inspect-attrs">Inspect storage attrs (read-only)</button>
        <button type="button" id="btn-inspect-capacity">Inspect volume capacity (read-only)</button>
        <button type="button" id="btn-inspect-secure-candidate">Inspect secure candidate (read-only)</button>
        <button type="button" id="btn-bootstrap-secure-candidate">Bootstrap encrypted journal candidate</button>
      </div>
      <label class="note" for="copy-entry-ids">
        4B-4B explicit Server entry IDs（candidate のみ・本番 DB 不可）
        <textarea
          id="copy-entry-ids"
          rows="3"
          style="display:block;width:100%;margin-top:0.35rem;font:inherit"
          placeholder="cuid を改行またはカンマ区切りで明示指定。自動検索しません。"
        ></textarea>
      </label>
      <div class="actions">
        <button type="button" id="btn-copy-to-secure-candidate">Copy explicit IDs to encrypted candidate</button>
      </div>
      <label class="note" for="write-through-entry-id">
        4B-4E write-through mirror（明示1件・本番 save には未接続）
        <input
          id="write-through-entry-id"
          type="text"
          style="display:block;width:100%;margin-top:0.35rem;font:inherit"
          placeholder="新規テスト専用 cuid（#WriteThroughTest / #テスト）"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
        />
      </label>
      <div class="actions">
        <button type="button" id="btn-write-through-mirror">Write-through mirror (explicit ID)</button>
        <button type="button" id="btn-write-through-poc">Run W1–W10 write-through PoC</button>
      </div>
      <div class="actions">
        <button type="button" id="btn-read-activation-manifest">Read activation manifest (read-only)</button>
        <button type="button" id="btn-technical-activation">Technical activation (candidate only)</button>
        <button type="button" id="btn-activation-pointer-poc">Run P1–P12 activation pointer PoC</button>
      </div>
      <div class="actions">
        <button type="button" id="btn-resolve-generation">Resolve technical generation (read-only)</button>
        <button type="button" id="btn-mirror-via-resolved">Mirror via resolved generation</button>
        <button type="button" id="btn-generation-resolver-poc">Run R1–R10 generation resolver PoC</button>
      </div>
      <div class="actions">
        <button type="button" id="btn-outbox-list">List mirror outbox (read-only)</button>
        <button type="button" id="btn-outbox-enqueue-fixture">Enqueue fixture (before mirror)</button>
        <button type="button" id="btn-outbox-poc">Run Q1–Q12 outbox PoC</button>
      </div>
      <div class="actions">
        <button type="button" id="btn-registry-list">List generation registry (read-only)</button>
        <button type="button" id="btn-registry-init">Initialize registry (candidate 1 row)</button>
        <button type="button" id="btn-resolve-with-registry">Resolve + registry validation</button>
        <button type="button" id="btn-registry-poc">Run K1–K11 registry PoC</button>
      </div>
      <p id="status" class="status">起動中…</p>
      <section>
        <h2 style="font-size: 0.95rem; font-family: system-ui, sans-serif">Security attrs</h2>
        <pre id="security-report" class="status" style="max-height: 14rem; overflow: auto">未実行</pre>
      </section>
      <section>
        <h2 style="font-size: 0.95rem; font-family: system-ui, sans-serif">読込結果</h2>
        <div id="list"></div>
        <img id="preview" alt="" hidden />
      </section>
    </main>
    <script src="./lab.js"></script>
  </body>
</html>
