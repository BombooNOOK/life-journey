<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Life Journey Diary</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, sans-serif;
        background: #faf8f4;
        color: #1c1917;
      }
      main {
        max-width: 28rem;
        line-height: 1.6;
      }
      code {
        background: #efebe4;
        padding: 0.1rem 0.35rem;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Life Journey Diary</h1>
      <p>
        これは Capacitor 初期化用のプレースホルダです。完成版 LJD ではありません。
      </p>
      <p>
        Phase 4B-1 検証では、開発／Preview の URL を
        <code>CAPACITOR_SERVER_URL</code> に指定してから
        <code>npm run cap:sync:ios</code> を実行してください（本番 URL の固定埋め込みはしません）。
      </p>
      <p>
        例:
        <code>CAPACITOR_SERVER_URL=http://127.0.0.1:3000 npm run cap:sync:ios</code>
      </p>
    </main>
  </body>
</html>
