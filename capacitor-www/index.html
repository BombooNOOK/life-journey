<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Local-first Storage Lab｜LJD PoC</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1917;
        --muted: #78716c;
        --paper: #faf8f4;
        --card: #fffdf9;
        --line: #e7e0d5;
        --accent: #3f5d4a;
        --danger: #9a3412;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-rounded, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        background: linear-gradient(180deg, #eef3ea 0%, var(--paper) 40%);
        color: var(--ink);
        padding: max(1rem, env(safe-area-inset-top)) 1rem
          max(1.5rem, env(safe-area-inset-bottom));
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.35rem;
      }
      .note {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
        margin: 0 0 1rem;
      }
      .actions {
        display: grid;
        gap: 0.6rem;
        margin: 1rem 0;
      }
      button {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 0.75rem;
        padding: 0.85rem 1rem;
        font-size: 1rem;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.45;
      }
      #btn-save {
        background: var(--accent);
        color: #fff;
        border-color: transparent;
      }
      #btn-clear {
        color: var(--danger);
      }
      .status {
        margin: 0.75rem 0;
        padding: 0.75rem 0.9rem;
        border-radius: 0.75rem;
        background: #fff;
        border: 1px solid var(--line);
        font-size: 0.9rem;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      .status.err {
        border-color: #fecaca;
        background: #fff7f5;
        color: var(--danger);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.85rem;
        padding: 0.9rem 1rem;
        margin: 0.6rem 0;
      }
      .card h3 {
        margin: 0 0 0.4rem;
        font-size: 1.05rem;
      }
      .card p {
        margin: 0.25rem 0;
        line-height: 1.45;
      }
      .meta,
      .muted,
      #platform {
        color: var(--muted);
        font-size: 0.8rem;
      }
      #preview {
        display: block;
        max-width: 10rem;
        margin: 0.75rem 0 0;
        border-radius: 0.75rem;
        border: 1px solid var(--line);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Local-first Storage Lab</h1>
      <p class="note">
        Phase 4B-2A 実験画面です。正式 LJD UI ではありません。本番あしあと・Neon・Blob
        は使いません。SQLite（本文）＋ Filesystem Library（画像）のみ。
      </p>
      <p id="platform" class="muted">platform…</p>

      <div class="actions">
        <button type="button" id="btn-save">テストあしあとを端末に残す</button>
        <button type="button" id="btn-load">端末のあしあとを読む</button>
        <button type="button" id="btn-clear">テストデータを削除</button>
      </div>

      <p id="status" class="status">起動中…</p>

      <section>
        <h2 style="font-size: 1rem">読込結果</h2>
        <div id="list"></div>
        <img id="preview" alt="PoC media preview" hidden />
      </section>
    </main>
    <script>
      // One-shot agent assist. Default false for normal Lab use.
      window.__LJD_POC_AUTOVERIFY__ = false;
    </script>
    <script src="./lab.js"></script>
  </body>
</html>
